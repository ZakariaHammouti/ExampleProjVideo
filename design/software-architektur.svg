<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 680 410">
<title>Software-Architektur Restaurant Finder</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t,.th{font-size:14px;fill:#1f1d1a}.th{font-weight:600}.ts{font-size:12px;fill:#6b665e}
.arr{stroke:#6b665e;stroke-width:1.5;fill:none}
.box{fill:#F1EFE8;stroke:#5F5E5A}
.cont{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 3}
.c-purple>rect,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th{fill:#791F1F}
.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}
</style></defs>
<rect width="680" height="410" fill="#ffffff"/>
<rect class="cont" x="40" y="30" width="180" height="330" rx="16"/>
<text class="th" x="130" y="55" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="ts" x="130" y="73" text-anchor="middle" dominant-baseline="central">React + Vite :5173</text>
<rect class="cont" x="250" y="30" width="210" height="330" rx="16"/>
<text class="th" x="355" y="55" text-anchor="middle" dominant-baseline="central">Backend</text>
<text class="ts" x="355" y="73" text-anchor="middle" dominant-baseline="central">Spring Boot :8080</text>
<rect class="cont" x="480" y="30" width="160" height="330" rx="16"/>
<text class="th" x="560" y="55" text-anchor="middle" dominant-baseline="central">Daten</text>
<text class="ts" x="560" y="73" text-anchor="middle" dominant-baseline="central">Cloud / extern</text>
<g class="c-purple"><rect x="55" y="95" width="150" height="56" rx="8" stroke-width="0.8"/><text class="th" x="130" y="113" text-anchor="middle" dominant-baseline="central">Komponenten</text><text class="ts" x="130" y="133" text-anchor="middle" dominant-baseline="central">SearchBar, Card …</text></g>
<g class="c-purple"><rect x="55" y="181" width="150" height="56" rx="8" stroke-width="0.8"/><text class="th" x="130" y="199" text-anchor="middle" dominant-baseline="central">api.ts</text><text class="ts" x="130" y="219" text-anchor="middle" dominant-baseline="central">fetch /api/*</text></g>
<g class="c-purple"><rect x="55" y="267" width="150" height="56" rx="8" stroke-width="0.8"/><text class="th" x="130" y="285" text-anchor="middle" dominant-baseline="central">Vite-Proxy</text><text class="ts" x="130" y="305" text-anchor="middle" dominant-baseline="central">/api → :8080</text></g>
<line x1="130" y1="151" x2="130" y2="179" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="237" x2="130" y2="265" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="265" y="95" width="180" height="56" rx="8" stroke-width="0.8"/><text class="th" x="355" y="113" text-anchor="middle" dominant-baseline="central">Controller</text><text class="ts" x="355" y="133" text-anchor="middle" dominant-baseline="central">REST, Statuscodes</text></g>
<g class="c-teal"><rect x="265" y="181" width="180" height="56" rx="8" stroke-width="0.8"/><text class="th" x="355" y="199" text-anchor="middle" dominant-baseline="central">Service</text><text class="ts" x="355" y="219" text-anchor="middle" dominant-baseline="central">Logik, Filter, Distanz</text></g>
<g class="c-teal"><rect x="265" y="267" width="180" height="56" rx="8" stroke-width="0.8"/><text class="th" x="355" y="285" text-anchor="middle" dominant-baseline="central">Repository</text><text class="ts" x="355" y="305" text-anchor="middle" dominant-baseline="central">Spring Data Mongo</text></g>
<line x1="355" y1="151" x2="355" y2="179" class="arr" marker-end="url(#arrow)"/>
<line x1="355" y1="237" x2="355" y2="265" class="arr" marker-end="url(#arrow)"/>
<path d="M205 295 L235 295 L235 123 L263 123" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="490" y="267" width="140" height="56" rx="8" stroke-width="0.8"/><text class="th" x="560" y="285" text-anchor="middle" dominant-baseline="central">MongoDB Atlas</text><text class="ts" x="560" y="305" text-anchor="middle" dominant-baseline="central">restaurants</text></g>
<g class="c-coral"><rect x="490" y="181" width="140" height="56" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" x="560" y="199" text-anchor="middle" dominant-baseline="central">OpenStreetMap</text><text class="ts" x="560" y="219" text-anchor="middle" dominant-baseline="central">geplant</text></g>
<line x1="445" y1="295" x2="488" y2="295" class="arr" marker-end="url(#arrow)"/>
<line x1="445" y1="209" x2="488" y2="209" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">Durchgezogen = umgesetzt · gestrichelt = geplant</text>
</svg>
