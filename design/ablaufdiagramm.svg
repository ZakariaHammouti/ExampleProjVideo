<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 680 470">
<title>Ablaufdiagramm Restaurant Finder</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t,.th{font-size:14px;fill:#1f1d1a}.th{font-weight:600}.ts{font-size:12px;fill:#6b665e}
.arr{stroke:#6b665e;stroke-width:1.5;fill:none}
.box{fill:#F1EFE8;stroke:#5F5E5A}
.cont{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 3}
.c-purple>rect,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th{fill:#791F1F}
.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}
</style></defs>
<rect width="680" height="470" fill="#ffffff"/>
<rect class="box" x="210" y="30" width="260" height="44" rx="8" stroke-width="0.8"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">App öffnen</text>
<line x1="340" y1="74" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="210" y="100" width="260" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">Daten laden</text><text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central">GET /restaurants + /cuisines</text></g>
<line x1="340" y1="156" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><polygon points="340,182 430,222 340,262 250,222" stroke-width="0.8"/><text class="th" x="340" y="222" text-anchor="middle" dominant-baseline="central">Backend ok?</text></g>
<line x1="430" y1="222" x2="488" y2="222" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="459" y="208" text-anchor="middle" dominant-baseline="central">nein</text>
<g class="c-red"><rect x="490" y="200" width="150" height="44" rx="8" stroke-width="0.8"/><text class="th" x="565" y="222" text-anchor="middle" dominant-baseline="central">Fehlermeldung</text></g>
<line x1="340" y1="262" x2="340" y2="288" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="354" y="275" dominant-baseline="central">ja</text>
<g class="c-teal"><rect x="210" y="290" width="260" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="308" text-anchor="middle" dominant-baseline="central">Liste anzeigen</text><text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">sortiert nach Bewertung</text></g>
<line x1="340" y1="346" x2="340" y2="370" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="210" y="372" width="260" height="56" rx="8" stroke-width="0.8"/><text class="th" x="340" y="390" text-anchor="middle" dominant-baseline="central">Suche / Filter ändern</text><text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">neue Anfrage ans Backend</text></g>
<path d="M210 400 L170 400 L170 128 L208 128" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="264" text-anchor="end" dominant-baseline="central">erneut laden</text>
</svg>
