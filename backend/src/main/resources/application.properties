spring.application.name=backend

# MongoDB-Verbindung: Connection String kommt aus der Umgebungsvariable MONGODB_URI
# (in IntelliJ: Run-Konfiguration "Backend" -> Environment variables).
# Ohne Variable wird eine lokale MongoDB auf localhost:27017 verwendet.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=exampleProjVideo

# Fehlermeldungen (z. B. "Ort nicht gefunden") im JSON an das Frontend mitschicken
server.error.include-message=always
# Keine internen Details (Stacktrace) an den Browser schicken
server.error.include-stacktrace=never

# Externe API: OpenStreetMap (kostenlos, kein API-Key)
app.osm.nominatim-url=https://nominatim.openstreetmap.org
# Overpass-Server (kommagetrennt, werden der Reihenfolge nach probiert).
# Fallen alle aus, wird automatisch Nominatim als Ausweichquelle genutzt.
app.osm.overpass-urls=https://overpass-api.de/api/interpreter
