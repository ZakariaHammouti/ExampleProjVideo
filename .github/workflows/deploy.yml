# =====================================================================
# Deploy-Pipeline: Frontend bauen -> Backend bauen -> Docker Hub -> Render
#
# WICHTIG zum Verständnis:
# Jeder Job läuft auf einer eigenen, frischen (leeren) Maschine.
# Was ein Job baut, ist danach weg – außer er legt es als "Artefakt"
# bei GitHub ab. Der nächste Job lädt dieses Artefakt dann wieder herunter.
#
#   build-frontend  --(Artefakt: frontend-build)-->  build-backend
#   build-backend   --(Artefakt: app-jar)-------->  push-to-docker-hub
#   push-to-docker-hub  ------------------------->  deploy-to-render
# =====================================================================

name: Deploy

# Wann läuft die Pipeline? Bei jedem Push auf den Branch "master".
on:
  push:
    branches:
      - master

jobs:

  # -------------------------------------------------------------------
  # JOB 1: Frontend bauen (React/Vite)
  # Ergebnis: Ordner frontend/dist (index.html + assets)
  # -------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Code aus dem GitHub-Repo auf die (leere) Maschine holen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.js installieren, npm-Pakete zwischenspeichern (macht spätere Läufe schneller)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Abhängigkeiten genau nach package-lock.json installieren
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Frontend bauen -> Ergebnis landet in frontend/dist
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # frontend/dist bei GitHub ablegen, damit Job 2 es benutzen kann
      - name: Upload Frontend-Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # -------------------------------------------------------------------
  # JOB 2: Backend bauen (Spring Boot mit Maven)
  # Das gebaute Frontend wird in den static-Ordner gelegt, damit es
  # ins Jar eingepackt wird. Ergebnis: backend/target/myApp.jar
  # -------------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    # Erst starten, wenn Job 1 erfolgreich war
    needs: build-frontend

    steps:
      # Neue Maschine -> Code wieder holen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 25 installieren (wie in der pom.xml), Maven-Pakete zwischenspeichern
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Sicherheitshalber alte Frontend-Dateien im static-Ordner löschen
      - name: Clean static folder
        run: rm -rf backend/src/main/resources/static

      # Das Frontend-Artefakt aus Job 1 direkt in den static-Ordner laden
      - name: Download Frontend-Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: backend/src/main/resources/static

      # Backend bauen (inkl. Tests). Der Name myApp.jar kommt aus
      # <finalName>myApp</finalName> in der pom.xml
      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml

      # Das fertige Jar bei GitHub ablegen, damit Job 3 es benutzen kann
      - name: Upload Backend-Build
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/myApp.jar

  # -------------------------------------------------------------------
  # JOB 3: Docker-Image bauen und zu Docker Hub pushen
  # Benutzt die Dockerfile im Projektordner. Die kopiert
  # backend/target/myApp.jar ins Image.
  # -------------------------------------------------------------------
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    # Erst starten, wenn Job 2 erfolgreich war
    needs: build-backend

    steps:
      # Code holen (wir brauchen hier vor allem die Dockerfile)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Das Jar aus Job 2 genau dorthin laden, wo die Dockerfile es erwartet
      - name: Download Backend-Build
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/target

      # QEMU + Buildx: nötig, um das Image für zwei Prozessor-Typen zu bauen
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bei Docker Hub anmelden. Die Werte kommen aus den GitHub-Secrets
      # (Settings -> Secrets and variables -> Actions)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image bauen und hochladen
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # "." = Dockerfile im Projektordner benutzen
          context: .
          push: true
          # amd64 für Render/normale Server, arm64 für Apple-Silicon-Macs
          platforms: linux/amd64,linux/arm64
          # Ergebnis: zakariahammouti/mein-backend:latest (überschreibt das alte latest)
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mein-backend:latest

  # -------------------------------------------------------------------
  # JOB 4: Render sagen, dass ein neues Image bereitliegt
  # Render holt daraufhin mein-backend:latest von Docker Hub und startet neu.
  # -------------------------------------------------------------------
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Erst starten, wenn das neue Image auf Docker Hub liegt
    needs: push-to-docker-hub

    steps:
      # Deploy Hook von Render aufrufen (geheime URL aus den GitHub-Secrets).
      # --fail: Job schlägt fehl, wenn Render einen Fehler zurückgibt
      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
