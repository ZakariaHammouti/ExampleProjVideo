name: Deploy

on:
  push:
    branches:
      - master

jobs:
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Frontend bauen
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 2. Gebautes Frontend ins Backend kopieren (alte Dateien vorher löschen)
      - name: Copy frontend into backend static folder
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/. backend/src/main/resources/static/

      # 3. Backend mit Maven bauen -> backend/target/myApp.jar
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build backend with Maven
        run: mvn -B package --file backend/pom.xml

      # 4. Docker-Image bauen und zu Docker Hub pushen
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 für Render/normale Server, arm64 für Apple-Silicon-Macs
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mein-backend:latest

  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Erst starten, wenn das neue Image auf Docker Hub liegt
    needs: push-to-docker-hub

    steps:
      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
